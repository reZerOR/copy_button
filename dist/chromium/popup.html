<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Button Copy</title>
  <script src="lib/api.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <header class="popup-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="10" width="21" height="14" rx="4" stroke="currentColor" stroke-width="2"/><path d="M10 10V8a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-1" stroke="currentColor" stroke-width="2"/></svg>
      <span>Button Copy</span>
    </div>
    <button class="icon-button" data-theme-switch aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    </button>
  </header>
  <main>
    <h1>Found a button?<br>Keep the details.</h1>
    <p class="muted">Save its styling, interaction states, and available animations to your library.</p>
    <button class="primary full" id="capture">Choose a button <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 9-7 1-3 7-4-17Z"/></svg></button>
    <button class="secondary full" id="library">Open library <span class="count" id="count">0</span></button>
    <p id="status" role="status" class="feedback" hidden></p>
  </main>
  <footer><span class="local-dot" aria-hidden="true"></span>Saved on this device. Yours to export.</footer>
</body>
</html>
